<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7b3fe4" />
    <title>Duplo Build — Joe's chunky bricks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="stage" aria-label="Brick building scene"></canvas>

    <div id="hud">
      <header class="topbar">
        <div class="brand">
          <span class="sparkle" aria-hidden="true">✦</span>
          <div>
            <h1>Duplo Build</h1>
            <p>Joe Schneider's chunky brick studio</p>
          </div>
        </div>
        <div class="tools">
          <button type="button" class="tool" data-action="rotate">Rotate</button>
          <button type="button" class="tool" data-action="delete">Delete</button>
          <button type="button" class="tool" data-action="undo">Undo</button>
          <button type="button" class="tool danger" data-action="clear">Clear</button>
        </div>
      </header>

      <div class="toast" data-toast data-show="false" role="status" aria-live="polite"></div>

      <footer class="dock">
        <div class="dock-main">
          <div class="dock-row brick-picker-row">
            <span class="dock-label" id="brick-picker-label">Bricks</span>
            <div class="brick-picker" data-brick-picker>
              <button
                type="button"
                class="brick-trigger"
                data-brick-trigger
                aria-expanded="false"
                aria-haspopup="listbox"
                aria-controls="brick-menu"
                aria-label="Choose a brick"
              >
                <span class="mini-wrap" aria-hidden="true">
                  <span class="mini" data-current-shape="brick2x2"></span>
                </span>
                <span class="brick-trigger-label" data-current-label>2×2</span>
                <span class="chevron" aria-hidden="true"></span>
              </button>
              <div class="brick-menu" data-brick-menu hidden>
                <div
                  id="brick-menu"
                  class="brick-grid"
                  data-bricks
                  role="listbox"
                  aria-labelledby="brick-picker-label"
                ></div>
              </div>
            </div>
          </div>
          <div class="dock-row color-picker-row">
            <span class="dock-label">Colors</span>
            <div class="color-row" data-colors></div>
          </div>
          <div class="dock-row paint-picker-row">
            <span class="dock-label" id="paint-picker-label">Paint</span>
            <div class="face-row" data-paints role="group" aria-labelledby="paint-picker-label"></div>
          </div>
        </div>
        <p class="hint">
          <span data-count>Empty board</span>
          <span data-place-hint> · Shadow follows you → tap to lock → tap again to place</span>
        </p>
      </footer>
    </div>

    <div id="webgl-fallback" hidden>
      <h2>Need a 3D-ready browser</h2>
      <p>Duplo Build uses WebGL for the brick scene. Try a current Chrome, Safari, Firefox, or Edge window.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
